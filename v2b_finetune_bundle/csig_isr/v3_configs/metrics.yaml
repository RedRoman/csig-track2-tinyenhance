# Single source of truth for local proxy evaluation.
# v3 uses these exact names in training validation, sweeps and final audit.
metrics:
  lpips: lpips
  dists: dists
  niqe: niqe
  musiq: musiq
  maniqa: maniqa           # 2026-08-21 修正：官方 eval.py 用的是 create_metric("maniqa")=koniq，六周误优化 pipal
  clipiqa: clipiqa
score:
  # Local surrogate only. The organizer's exact final formula/variants are not public.
  expression: "(1-lpips)+(1-dists)+clipiqa+maniqa+musiq/100+max(0,(10-niqe)/10)"
aggregation:
  canonical: "score(mean(component_metrics_across_crops))"
  forbidden_for_model_selection: "mean(score(per_crop_metrics))"
